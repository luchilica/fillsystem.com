<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101223"/>
      <stop offset="100%" stop-color="#222335"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2551D2" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2551D2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Central agent node -->
  <circle cx="600" cy="315" r="50" fill="rgba(59,123,247,0.12)" stroke="#3B7BF7" stroke-width="2"/>
  <circle cx="600" cy="315" r="12" fill="#3B7BF7" opacity="0.8"/>
  <!-- Prerequisite nodes around -->
  <g fill="rgba(59,123,247,0.08)" stroke="rgba(59,123,247,0.35)" stroke-width="1.5">
    <rect x="180" y="130" width="140" height="50" rx="8"/>
    <rect x="880" y="130" width="140" height="50" rx="8"/>
    <rect x="120" y="380" width="140" height="50" rx="8"/>
    <rect x="940" y="380" width="140" height="50" rx="8"/>
    <rect x="440" y="500" width="140" height="50" rx="8"/>
    <rect x="620" y="500" width="140" height="50" rx="8"/>
  </g>
  <!-- Connection lines -->
  <g stroke="#3B7BF7" stroke-width="1" opacity="0.3">
    <line x1="320" y1="155" x2="555" y2="290"/>
    <line x1="880" y1="155" x2="645" y2="290"/>
    <line x1="260" y1="405" x2="560" y2="340"/>
    <line x1="940" y1="405" x2="640" y2="340"/>
    <line x1="510" y1="500" x2="580" y2="365"/>
    <line x1="690" y1="500" x2="620" y2="365"/>
  </g>
  <!-- Labels -->
  <g font-family="system-ui" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="0.05em" text-anchor="middle">
    <text x="250" y="160">PROCESS</text>
    <text x="950" y="160">DATA</text>
    <text x="190" y="410">PERMISSIONS</text>
    <text x="1010" y="410">APPROVAL</text>
    <text x="510" y="530">LOGGING</text>
    <text x="690" y="530">ROLLBACK</text>
    <text x="600" y="320" font-size="12" fill="rgba(255,255,255,0.6)">AGENT</text>
  </g>
</svg>
