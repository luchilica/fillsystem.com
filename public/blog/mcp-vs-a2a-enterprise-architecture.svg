<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101223"/>
      <stop offset="100%" stop-color="#222335"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#2551D2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2551D2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- MCP side (left) -->
  <g font-family="system-ui" font-size="11" fill="rgba(255,255,255,0.3)" letter-spacing="0.08em">
    <text x="220" y="100" text-anchor="middle">MCP</text>
  </g>
  <!-- Agent node left -->
  <circle cx="220" cy="250" r="35" fill="rgba(59,123,247,0.12)" stroke="#3B7BF7" stroke-width="2"/>
  <circle cx="220" cy="250" r="8" fill="#3B7BF7" opacity="0.7"/>
  <!-- Tool nodes -->
  <g fill="rgba(59,123,247,0.08)" stroke="rgba(59,123,247,0.3)" stroke-width="1.5">
    <rect x="80" y="380" width="80" height="40" rx="6"/>
    <rect x="180" y="380" width="80" height="40" rx="6"/>
    <rect x="280" y="380" width="80" height="40" rx="6"/>
  </g>
  <g stroke="#3B7BF7" stroke-width="1" opacity="0.35">
    <line x1="200" y1="285" x2="120" y2="380"/>
    <line x1="220" y1="285" x2="220" y2="380"/>
    <line x1="240" y1="285" x2="320" y2="380"/>
  </g>
  <g font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.3)" text-anchor="middle">
    <text x="120" y="405">CRM</text>
    <text x="220" y="405">DB</text>
    <text x="320" y="405">API</text>
  </g>
  <!-- Divider -->
  <line x1="500" y1="80" x2="500" y2="550" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="8 6"/>
  <!-- Bridge: A2A -->
  <g font-family="system-ui" font-size="11" fill="rgba(255,255,255,0.3)" letter-spacing="0.08em">
    <text x="600" y="200" text-anchor="middle">A2A</text>
  </g>
  <path d="M255 250 L545 250" stroke="#3B7BF7" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
  <path d="M655 250 L745 250" stroke="#3B7BF7" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
  <!-- A2A bridge node -->
  <rect x="545" y="230" width="110" height="40" rx="8" fill="rgba(59,123,247,0.1)" stroke="#3B7BF7" stroke-width="1.5"/>
  <g font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle">
    <text x="600" y="255">AGENT CARD</text>
  </g>
  <!-- A2A side (right) -->
  <g font-family="system-ui" font-size="11" fill="rgba(255,255,255,0.3)" letter-spacing="0.08em">
    <text x="880" y="100" text-anchor="middle">MCP</text>
  </g>
  <!-- Agent nodes right -->
  <circle cx="780" cy="250" r="28" fill="rgba(59,123,247,0.1)" stroke="#3B7BF7" stroke-width="1.5"/>
  <circle cx="780" cy="250" r="6" fill="#3B7BF7" opacity="0.6"/>
  <circle cx="980" cy="250" r="28" fill="rgba(59,123,247,0.1)" stroke="#3B7BF7" stroke-width="1.5"/>
  <circle cx="980" cy="250" r="6" fill="#3B7BF7" opacity="0.6"/>
  <path d="M808 250 L952 250" stroke="#3B7BF7" stroke-width="1" opacity="0.3"/>
  <!-- Tool nodes right -->
  <g fill="rgba(59,123,247,0.08)" stroke="rgba(59,123,247,0.3)" stroke-width="1.5">
    <rect x="740" y="380" width="80" height="40" rx="6"/>
    <rect x="940" y="380" width="80" height="40" rx="6"/>
  </g>
  <g stroke="#3B7BF7" stroke-width="1" opacity="0.3">
    <line x1="780" y1="278" x2="780" y2="380"/>
    <line x1="980" y1="278" x2="980" y2="380"/>
  </g>
  <g font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.3)" text-anchor="middle">
    <text x="780" y="405">SEARCH</text>
    <text x="980" y="405">EMAIL</text>
  </g>
  <!-- Enterprise controls bar -->
  <rect x="100" y="490" width="1000" height="50" rx="8" fill="rgba(59,123,247,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <g font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.2)" letter-spacing="0.06em" text-anchor="middle">
    <text x="250" y="520">IDENTITY</text>
    <text x="450" y="520">PERMISSIONS</text>
    <text x="650" y="520">APPROVALS</text>
    <text x="850" y="520">AUDIT LOG</text>
  </g>
</svg>
