<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101223"/>
      <stop offset="100%" stop-color="#222335"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#2551D2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2551D2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Vector grid (embedding space) -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="100" y1="100" x2="100" y2="530"/><line x1="200" y1="100" x2="200" y2="530"/>
    <line x1="300" y1="100" x2="300" y2="530"/><line x1="400" y1="100" x2="400" y2="530"/>
    <line x1="500" y1="100" x2="500" y2="530"/><line x1="600" y1="100" x2="600" y2="530"/>
    <line x1="700" y1="100" x2="700" y2="530"/><line x1="800" y1="100" x2="800" y2="530"/>
    <line x1="900" y1="100" x2="900" y2="530"/><line x1="1000" y1="100" x2="1000" y2="530"/>
    <line x1="1100" y1="100" x2="1100" y2="530"/>
    <line x1="100" y1="150" x2="1100" y2="150"/><line x1="100" y1="250" x2="1100" y2="250"/>
    <line x1="100" y1="350" x2="1100" y2="350"/><line x1="100" y1="450" x2="1100" y2="450"/>
  </g>
  <!-- Document nodes (input) -->
  <g fill="rgba(59,123,247,0.15)" stroke="#3B7BF7" stroke-width="1.5">
    <rect x="140" y="200" width="60" height="40" rx="6"/>
    <rect x="140" y="280" width="60" height="40" rx="6"/>
    <rect x="140" y="360" width="60" height="40" rx="6"/>
  </g>
  <!-- Embedding paths (parallel lines) -->
  <g stroke="#3B7BF7" stroke-width="1.5" opacity="0.4">
    <path d="M200 220 L420 220 L480 300"/>
    <path d="M200 300 L420 300 L480 300"/>
    <path d="M200 380 L420 380 L480 300"/>
  </g>
  <!-- Central embedding node (highlighted) -->
  <circle cx="520" cy="300" r="30" fill="rgba(59,123,247,0.2)" stroke="#3B7BF7" stroke-width="2"/>
  <circle cx="520" cy="300" r="6" fill="#3B7BF7"/>
  <!-- Vector index -->
  <g stroke="#3B7BF7" stroke-width="1" opacity="0.3">
    <path d="M550 300 L700 180"/><path d="M550 300 L700 260"/>
    <path d="M550 300 L700 340"/><path d="M550 300 L700 420"/>
  </g>
  <!-- Index dots -->
  <g fill="#3B7BF7" opacity="0.5">
    <circle cx="700" cy="180" r="5"/><circle cx="700" cy="260" r="5"/>
    <circle cx="700" cy="340" r="5"/><circle cx="700" cy="420" r="5"/>
  </g>
  <!-- Selected path highlight -->
  <path d="M700 260 L900 260 L950 315" stroke="#3B7BF7" stroke-width="2.5" opacity="0.7" fill="none"/>
  <!-- Result panel -->
  <rect x="920" y="240" width="180" height="150" rx="10" fill="rgba(59,123,247,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <g font-family="system-ui" font-size="10" fill="rgba(255,255,255,0.3)" letter-spacing="0.06em">
    <text x="940" y="270">RETRIEVAL QUALITY</text>
    <text x="940" y="310">COST PER QUERY</text>
    <text x="940" y="350">RE-INDEX RISK</text>
  </g>
</svg>
