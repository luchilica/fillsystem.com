<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="1200" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101223"/>
      <stop offset="100%" stop-color="#222335"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#2551D2" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2551D2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Test scenario lanes -->
  <g font-family="system-ui" font-size="10" letter-spacing="0.06em">
    <!-- Lane 1: Normal -->
    <rect x="100" y="120" width="1000" height="70" rx="8" fill="rgba(59,123,247,0.06)" stroke="rgba(59,123,247,0.15)" stroke-width="1"/>
    <text x="130" y="160" fill="rgba(255,255,255,0.35)">NORMAL OPERATIONS</text>
    <g fill="#3B7BF7" opacity="0.6">
      <circle cx="400" cy="155" r="4"/><circle cx="500" cy="155" r="4"/><circle cx="600" cy="155" r="4"/>
      <circle cx="700" cy="155" r="4"/><circle cx="800" cy="155" r="4"/>
    </g>
    <rect x="980" y="142" width="60" height="26" rx="4" fill="rgba(59,123,247,0.2)"/>
    <text x="995" y="160" fill="#3B7BF7" font-size="9">PASS</text>
    <!-- Lane 2: Adversarial -->
    <rect x="100" y="210" width="1000" height="70" rx="8" fill="rgba(59,123,247,0.06)" stroke="rgba(59,123,247,0.15)" stroke-width="1"/>
    <text x="130" y="250" fill="rgba(255,255,255,0.35)">ADVERSARIAL INPUTS</text>
    <g fill="#3B7BF7" opacity="0.4">
      <circle cx="400" cy="245" r="4"/><circle cx="520" cy="245" r="4"/><circle cx="640" cy="245" r="4"/>
    </g>
    <circle cx="760" cy="245" r="4" fill="rgba(255,120,100,0.5)"/>
    <!-- Lane 3: Tool failure -->
    <rect x="100" y="300" width="1000" height="70" rx="8" fill="rgba(59,123,247,0.06)" stroke="rgba(59,123,247,0.15)" stroke-width="1"/>
    <text x="130" y="340" fill="rgba(255,255,255,0.35)">TOOL FAILURE</text>
    <g fill="#3B7BF7" opacity="0.4">
      <circle cx="400" cy="335" r="4"/><circle cx="500" cy="335" r="4"/>
    </g>
    <!-- Lane 4: Cost -->
    <rect x="100" y="390" width="1000" height="70" rx="8" fill="rgba(59,123,247,0.06)" stroke="rgba(59,123,247,0.15)" stroke-width="1"/>
    <text x="130" y="430" fill="rgba(255,255,255,0.35)">COST BOUNDARIES</text>
    <!-- Lane 5: Rollback -->
    <rect x="100" y="480" width="1000" height="70" rx="8" fill="rgba(59,123,247,0.06)" stroke="rgba(59,123,247,0.15)" stroke-width="1"/>
    <text x="130" y="520" fill="rgba(255,255,255,0.35)">ROLLBACK SCENARIOS</text>
  </g>
</svg>
