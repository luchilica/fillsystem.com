    <rect x="520" y="340" width="160" height="32" rx="5" fill="rgba(59,123,247,0.1)" stroke="rgba(59,123,247,0.3)" stroke-width="1"/>
    <text x="548" y="360" fill="rgba(255,255,255,0.4)">TESTING</text>
    <rect x="520" y="390" width="160" height="32" rx="5" fill="rgba(59,123,247,0.1)" stroke="rgba(59,123,247,0.3)" stroke-width="1"/>
    <text x="548" y="410" fill="rgba(255,255,255,0.4)">MONITORING</text>
    <rect x="520" y="440" width="160" height="32" rx="5" fill="rgba(59,123,247,0.1)" stroke="rgba(59,123,247,0.3)" stroke-width="1"/>
