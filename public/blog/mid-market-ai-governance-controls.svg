    <rect x="520" y="240" width="160" height="32" rx="5" fill="rgba(59,123,247,0.1)" stroke="rgba(59,123,247,0.3)" stroke-width="1"/>
    <text x="548" y="260" fill="rgba(255,255,255,0.4)">OWNERSHIP</text>
    <rect x="520" y="290" width="160" height="32" rx="5" fill="rgba(59,123,247,0.1)" stroke="rgba(59,123,247,0.3)" stroke-width="1"/>
