<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101223"/>
      <stop offset="100%" stop-color="#222335"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2551D2" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2551D2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Shield outline -->
  <path d="M600 100 L750 160 L750 350 Q750 460,600 530 Q450 460,450 350 L450 160 Z" fill="rgba(59,123,247,0.06)" stroke="#3B7BF7" stroke-width="1.5" opacity="0.5"/>
  <!-- Inner shield ring -->
  <path d="M600 150 L710 195 L710 340 Q710 420,600 475 Q490 420,490 340 L490 195 Z" fill="none" stroke="rgba(59,123,247,0.2)" stroke-width="1" stroke-dasharray="4 3"/>
